[project]
name = "paperharvest"
version = "0.1.0"
description = "Extensible terminal tool for harvesting conference paper lists"
requires-python = ">=3.10"
dependencies = ["questionary>=2.0"]

[project.scripts]
paperharvest = "paperharvest.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
